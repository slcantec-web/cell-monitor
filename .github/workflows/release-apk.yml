name: Release APK + update site

# Publishes the APK as a GitHub Release and updates web/version.json (served by Cloudflare Pages),
# which is what the in-app updater reads.
#
#   Tag push:   git tag v1.1.0 && git push origin v1.1.0
#   Manual:     Actions → "Release APK + update site" → Run workflow (enter 1.1.0)
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   – base64 of the stable .keystore (same key every release)
#   KEYSTORE_PASSWORD – keystore password
#   KEY_ALIAS         – key alias (e.g. cellmonitor)
#   KEY_PASSWORD      – key password

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name, e.g. 1.1.0 (must increase)"
        required: true
      notes:
        description: "Release notes"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out version from tag / input
        id: v
        env:
          INPUT_NAME: ${{ github.event.inputs.versionName }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            NOTES="$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)')"
          else
            NAME="${INPUT_NAME#v}"
            NOTES="$INPUT_NOTES"
          fi
          if ! [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$NAME')"
            exit 1
          fi
          # Same formula as UpdateChecker.parseGithubRelease(): 1.2.3 -> 10203
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          [ -n "$NOTES" ] || NOTES="Cell Monitor $NAME"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.txt"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$NAME versionCode=$CODE tag=v$NAME"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore the signing keystore (must be the SAME key every release)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing."
            echo "::error::Android only installs an update over the existing app if every build is signed with the same key."
            echo "::error::See web/README.md (Signing key) for how to create and add the four secrets."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > debug.keystore
          # Sanity: file must be a readable keystore
          if [ ! -s debug.keystore ]; then
            echo "::error::KEYSTORE_BASE64 decoded to an empty file"
            exit 1
          fi
          echo "Keystore restored ($(wc -c < debug.keystore) bytes)"

      - name: Build APK
        env:
          CM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_NAME: ${{ steps.v.outputs.name }}
          APP_CODE: ${{ steps.v.outputs.code }}
        run: |
          if [ -z "$CM_STORE_PASSWORD" ] || [ -z "$CM_KEY_ALIAS" ] || [ -z "$CM_KEY_PASSWORD" ]; then
            echo "::error::Missing KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PappVersionName="$APP_NAME" \
            -PappVersionCode="$APP_CODE"
          # Always publish under the stable name the updater expects
          cp app/build/outputs/apk/debug/app-debug.apk CellMonitor.apk
          ls -la CellMonitor.apk

      - name: Sanity-check the APK (version, INTERNET permission)
        env:
          APP_NAME: ${{ steps.v.outputs.name }}
          APP_CODE: ${{ steps.v.outputs.code }}
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT2" dump badging CellMonitor.apk > badging.txt
          cat badging.txt | head -5
          grep -q "versionCode='$APP_CODE'" badging.txt || { echo "::error::versionCode in the APK is not $APP_CODE"; exit 1; }
          grep -q "versionName='$APP_NAME'" badging.txt || { echo "::error::versionName in the APK is not $APP_NAME"; exit 1; }
          grep -q "uses-permission: name='android.permission.INTERNET'" badging.txt || { echo "::error::APK lacks INTERNET permission"; exit 1; }
          echo "APK OK: versionName=$APP_NAME versionCode=$APP_CODE"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          APP_NAME: ${{ steps.v.outputs.name }}
        run: |
          # Also remove any old mis-cased asset if present
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" CellMonitor.apk --clobber
          else
            # Prefer creating on the tag ref if it already exists; otherwise create tag + release
            if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" CellMonitor.apk \
                --title "Cell Monitor $APP_NAME" \
                --notes-file "$RUNNER_TEMP/notes.txt"
            else
              gh release create "$TAG" CellMonitor.apk \
                --target "$GITHUB_SHA" \
                --title "Cell Monitor $APP_NAME" \
                --notes-file "$RUNNER_TEMP/notes.txt"
            fi
          fi
          echo "Release $TAG published with CellMonitor.apk"

      - name: Update web/version.json on main (Cloudflare Pages redeploys)
        env:
          APP_NAME: ${{ steps.v.outputs.name }}
          APP_CODE: ${{ steps.v.outputs.code }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          import datetime, json, os
          notes = open(os.path.join(os.environ["RUNNER_TEMP"], "notes.txt")).read().strip()
          data = {
              "versionCode": int(os.environ["APP_CODE"]),
              "versionName": os.environ["APP_NAME"],
              "apkUrl": "https://github.com/%s/releases/latest/download/CellMonitor.apk" % os.environ["GITHUB_REPOSITORY"],
              "releaseNotes": notes,
              "minSdk": 30,
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("web/version.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          print(json.dumps(data, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/version.json
          if git diff --staged --quiet; then
            echo "version.json unchanged"
          else
            git commit -m "chore: publish $APP_NAME to the update site"
            git push origin main
          fi

      - name: Remove keystore
        if: always()
        run: rm -f debug.keystore
